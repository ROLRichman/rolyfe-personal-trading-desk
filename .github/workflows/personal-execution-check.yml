name: Personal Execution verification
on:
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "execution.js"
      - "execution.css"
      - "chart.css"
      - "styles.css"
      - "options-math.js"
      - "market-metrics.js"
      - "tests/**"
      - ".github/workflows/personal-execution-check.yml"
  push:
    branches:
      - "feature/market-health-replay-fundamentals"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check execution.js
          node --check options-math.js
          node --check market-metrics.js
      - name: Run calculation tests
        run: node --test tests/options-math.test.mjs tests/market-metrics.test.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Verify execution and market UI hooks
        run: |
          grep -q 'id="view-execution"' index.html
          grep -q 'id="execChainBody"' index.html
          grep -q 'id="execSave"' index.html
          grep -q 'id="replaySlider"' index.html
          grep -q 'id="healthGauge"' index.html
          grep -q 'id="fundamentalsChart"' index.html
          grep -q 'src="execution.js"' index.html
